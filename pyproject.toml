[project]
name = "service-b"
version = "0.1.0"
description = "Tiny FastAPI + Postgres CRUD service for the preview-environments demo"
authors = [
    { name = "Matthew Cummings", email = "matthewcummings516@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.103",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "testcontainers>=4.15.0",
]

# An application, not a library: `app/` runs from the project root (`python -m app`),
# so there is nothing to build or install into the venv.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
